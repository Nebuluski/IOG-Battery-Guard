name: CI
on:
  pull_request:
  push:
    branches: [main]

# Least-privilege read access for GITHUB_TOKEN. gitleaks-action needs
# pull-requests:read to list a PR's commits; without this the job 403s on
# repos whose default workflow token is restricted.
permissions:
  contents: read
  pull-requests: read

jobs:
  # ---- Python: lint + format check + tests on both OSes ----
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff pytest
      - run: ruff check .
      - run: ruff format --check .
      - name: pytest (tolerate "no tests yet")
        shell: bash
        run: |
          pytest -q || [ $? -eq 5 ]   # exit code 5 = no tests collected

  # ---- Lua: lint + format check (Ubuntu only, keeps it simple) ----
  # Only runs when the repo actually contains Lua files.
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect Lua files
        id: detect
        shell: bash
        run: |
          if [ -n "$(find . -name '*.lua' -not -path './.git/*' -print -quit)" ]; then
            echo "has_lua=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_lua=false" >> "$GITHUB_OUTPUT"
            echo "No .lua files — skipping Lua checks."
          fi
      # DCS mission Lua targets the 5.1 sandbox — lint on the SAME runtime so
      # luacheck's std=lua51 guard reflects what DCS actually runs.
      - if: steps.detect.outputs.has_lua == 'true'
        run: sudo apt-get update && sudo apt-get install -y lua5.1 liblua5.1-0-dev luarocks
      - if: steps.detect.outputs.has_lua == 'true'
        run: sudo luarocks install luacheck
      - if: steps.detect.outputs.has_lua == 'true'
        run: luacheck .   # hard gate: a 5.1 violation fails the build
      - if: steps.detect.outputs.has_lua == 'true'
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check .
      # Behavioural gate: run the real Busted suite on the same 5.1 runtime.
      # A repo with a pure-Lua runner (e.g. spec/run.lua) can mirror this locally
      # where Busted can't build; CI is the authoritative framework run. Busted
      # reads .busted (auto-discovers spec/*_spec.lua) and passes if there are no
      # specs yet, so this is safe for a freshly-scaffolded Lua project.
      - if: steps.detect.outputs.has_lua == 'true'
        run: sudo luarocks install busted
      - if: steps.detect.outputs.has_lua == 'true'
        name: Busted (offline suite on Lua 5.1)
        run: busted

  # ---- Node/TypeScript: install + lint + typecheck + tests (Ubuntu only) ----
  # Only runs when the repo has a root package.json (e.g. an Expo/React Native
  # app). Mirrored locally by preflight.py — keep the two in step.
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect Node project
        id: detect
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "has_node=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_node=false" >> "$GITHUB_OUTPUT"
            echo "No package.json — skipping Node checks."
          fi
          # Pin Node from .nvmrc when the repo has one; setup-node falls back
          # to the runner default when the input is empty.
          if [ -f .nvmrc ]; then
            echo "node_version_file=.nvmrc" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.detect.outputs.has_node == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: ${{ steps.detect.outputs.node_version_file }}
      - if: steps.detect.outputs.has_node == 'true'
        name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - if: steps.detect.outputs.has_node == 'true'
        run: npm run lint --if-present
      - if: steps.detect.outputs.has_node == 'true'
        name: TypeScript typecheck
        shell: bash
        run: |
          if [ -f tsconfig.json ]; then
            npx tsc --noEmit
          else
            echo "no tsconfig.json — skipping typecheck"
          fi
      - if: steps.detect.outputs.has_node == 'true'
        run: npm run test --if-present

  # ---- Leakguard: re-scan for secrets in the cloud (can't be bypassed locally) ----
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so a secret in any commit is caught
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action is free for public repos; uses the repo's .gitleaks.toml.

  # ---- Hard gate GitHub CAN see: every PR commit must reference a task ----
  commit-task-ref:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require "#<id>" in every commit message
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          bad=0
          for sha in $(git rev-list "$base".."$head"); do
            subject="$(git log -1 --format='%s' "$sha")"
            case "$subject" in Merge\ *|Revert\ *) continue ;; esac
            if ! git log -1 --format='%s%n%b' "$sha" | grep -Eq '#[0-9]+'; then
              echo "::error::commit $sha has no task ref (#id): $subject"
              bad=1
            fi
          done
          exit $bad
