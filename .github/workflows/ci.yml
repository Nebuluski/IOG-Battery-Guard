name: CI
on:
  pull_request:
  push:
    branches: [main]

# Cancel a superseded in-progress run on the SAME PR ref: pushing a fixup before
# CI finishes cancels the now-stale run. Scoped to PRs only, so a push-to-main
# run is never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege read access for GITHUB_TOKEN. `contents: read` is all any job
# here needs: the gitleaks job runs the scanner binary directly and resolves its
# scan range from the local git clone, so nothing here calls the GitHub API.
# `pull-requests: read` was removed with the action that wanted it -- see the
# gitleaks job below for why. Do not add a scope back without a job that needs it.
permissions:
  contents: read

# --- Minutes policy (private repos have a 2000-min/mo Actions allowance) ------
# The full suite runs on `pull_request` only. A merge to main is validated by
# the PR that introduced it, so re-running everything on the push was pure
# duplication — the push event now runs ONLY the gitleaks secret rescan (the one
# server-side check worth keeping on the merge commit). Windows CI was dropped
# entirely: it was the sole 2x-billed job. preflight.py runs the identical ruff
# checks on Windows (pre-push hook), but by default it no longer runs the tests
# there (PREFLIGHT_TESTS=ci, GEN-114): CI runs them. Set PREFLIGHT_TESTS=local to
# run them on Windows. Keep preflight.py <-> this file in lockstep.
#
# ONE SANCTIONED DIVERGENCE (workspace ADR 0008). A repo that registers a `slow`
# pytest marker in pyproject.toml runs `pytest -q -m "not slow"` locally, because
# a Windows run of a long shell-script suite can cost 30-50 minutes against under
# a minute here. preflight.py prints a loud banner when it narrows. Two
# consequences, both accepted deliberately:
#   * `slow`-marked tests get NO Windows execution -- not locally, not in CI. Mark
#     a test `slow` only when the thing it proves is platform-independent.
#   * Everything NOT marked `slow` still runs on Windows at every push.
# This job is unchanged and must stay unchanged: plain `pytest -q --durations=25`, no marker
# filter, every test. CI is the authority.
#
# RUNNER CHOICE (core v28, GEN-71, GEN-76). Every job's `runs-on` reads the repository
# variable CI_RUNS_ON, but ONLY when the repo is private
# (github.event.repository.private). Unset, or a public repo = GitHub-hosted
# `ubuntu-latest`. The value is JSON, so it holds one label or an array of labels.
# On a PRIVATE repo, set it to run on the homelab self-hosted runner:
#   gh variable set CI_RUNS_ON --body '["self-hosted","linux","x64"]' -R <owner>/<repo>
# The `private` guard only stops an HONEST workflow from using the variable on a
# public repo. It is NOT a security control: a fork PR runs its own copy of this
# workflow file and can set `runs-on` to anything. The real controls are (1) each
# runner on svc-ci01 is scoped to ONE repo, and (2) a repo's runner is removed
# when the repo goes public (GEN-73). Jobs run rootless, with no sudo (GEN-76):
# every tool installs under $HOME, never into /usr/local. The python job takes
# Python 3.12 from uv on a self-hosted runner (core v29, GEN-79). Scratch files go
# in $RUNNER_TEMP, never /tmp: slots are different users that share /tmp (core v30).

# FAIL FAST (core v33, GEN-106). A PRIVATE repo with CI_RUNS_ON unset must never
# fall back to paid GitHub runners. GitHub expressions cannot error at parse time,
# so the `runner-guard` job does it: it runs on the same runner the repo would
# pick (free on self-hosted; ~1 billed minute only in the misconfigured case),
# fails with a clear message, and every other job `needs` it, so none starts.
# Public repos stay on `ubuntu-latest` and the guard passes.

jobs:
  runner-guard:
    runs-on: ${{ fromJSON((github.event.repository.private && vars.CI_RUNS_ON) || '"ubuntu-latest"') }}
    timeout-minutes: 2
    steps:
      - if: github.event.repository.private && vars.CI_RUNS_ON == ''
        run: |
          echo "::error::CI_RUNS_ON unset on a private repo: set it, see GEN-106"
          echo "gh variable set CI_RUNS_ON --body '[\"self-hosted\",\"linux\",\"x64\"]' -R <owner>/<repo>"
          exit 1

  # ---- Python: lint + format check + tests (Ubuntu; PR only) ----
  python:
    needs: runner-guard
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON((github.event.repository.private && vars.CI_RUNS_ON) || '"ubuntu-latest"') }}
    # 20, not 10 (core v23): Homelab-Services' full suite reached 9 min 57 s of
    # pytest and the job was cancelled at the limit with no test failed (SVC-25).
    # The limit exists to stop a hung job, not to cap a healthy suite.
    # A repo raises it with the repository variable PYTHON_TIMEOUT_MINUTES
    # (core v25); unset, it stays 20.
    timeout-minutes: ${{ fromJSON(vars.PYTHON_TIMEOUT_MINUTES || '20') }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.environment == 'github-hosted'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Self-hosted svc-ci01 runs Debian 13 (core v29, GEN-79). setup-python has no
      # Debian 13 build, and the host python3 has no ensurepip, so it cannot make a
      # venv. uv fetches a standalone CPython 3.12 into $HOME, rootless, and the
      # seeded venv gives the same `python` and `pip` the hosted path has.
      - if: runner.environment != 'github-hosted'
        uses: astral-sh/setup-uv@v6
      # Dependency caches on the RUNNER DISK (core v33, GEN-106). Self-hosted only:
      # a GitHub-hosted job keeps the default. Deliberately NOT actions/cache,
      # which uploads to GitHub. setup-uv points UV_CACHE_DIR at $RUNNER_TEMP, which
      # is wiped per job, so it is overridden here. This runs after setup-uv and
      # BEFORE `uv venv`, so uv uses the persistent cache. $RUNNER_TOOL_CACHE
      # persists between jobs on the same runner and is rootless. A missing dir is
      # created (cold start). RUNNER_TOOL_CACHE is per runner slot by default
      # (<runner>/_work/_tool), so each slot has its own cache dir.
      - if: runner.environment != 'github-hosted'
        name: Dependency caches on runner disk (self-hosted)
        shell: bash
        run: |
          set -euo pipefail
          cache="$RUNNER_TOOL_CACHE/../ci-cache"
          mkdir -p "$cache/uv" "$cache/pip"
          cache="$(cd "$cache" && pwd)"
          echo "UV_CACHE_DIR=$cache/uv" >> "$GITHUB_ENV"
          echo "PIP_CACHE_DIR=$cache/pip" >> "$GITHUB_ENV"
      - if: runner.environment != 'github-hosted'
        name: Python 3.12 venv (self-hosted)
        shell: bash
        run: |
          uv venv --clear --seed --python 3.12 "$RUNNER_TEMP/py312"
          echo "$RUNNER_TEMP/py312/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/py312/bin/python" --version
      - run: pip install ruff pytest
      # A packaged repo (a real [project] table, e.g. src/ layout with runtime
      # deps) is installed so pytest imports it with its dependencies present.
      # The scaffold's tooling-only pyproject.toml has no [project] table, so
      # plain repos skip this and keep their pythonpath-based test imports.
      - name: Install project (when packaged)
        shell: bash
        run: |
          if grep -q '^\[project\]' pyproject.toml 2>/dev/null; then
            pip install -e .
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
      - run: ruff check .
      - run: ruff format --check .
      # Marked doc facts vs docs/facts.json (card GEN-29). The script itself
      # exits 0 with a note when the repo carries no facts file, so this is a
      # no-op for every repo that has not adopted one -- no shell guard needed
      # here. Keep this in lockstep with preflight.py's mirror of it.
      #
      # Path is resolved case-insensitively (GEN-54): a Windows checkout of a
      # repo with a pre-existing capital `Scripts/` dir (DCS repos) writes
      # this file into `Scripts/docfacts.py`, which the Ubuntu runner's
      # case-sensitive filesystem cannot see at the literal `scripts/` path.
      - name: docfacts (marked doc facts vs docs/facts.json)
        run: |
          f=scripts/docfacts.py
          [ -f "$f" ] || f=Scripts/docfacts.py
          python "$f"
      # Optional OpenTofu install (card GEN-56, core v22). A repo whose tests
      # skip on `shutil.which("tofu") is None` never ran them on the runner
      # (FORGE-268). The repo opts in with a tracked `.github/opentofu.pin`
      # holding TOFU_VERSION= and TOFU_SHA256= lines. That file is PROJECT-OWNED:
      # it is not a core-managed path and a sync never writes it. No file means
      # a no-op. A file that is present but broken FAILS the job: a bad pin must
      # never turn tofu tests into silent skips. The pin is repo content, so it
      # is parsed with grep/cut and never sourced or eval'd.
      # preflight.py has no mirror: it never installs tools. A missing tool is
      # skipped locally and CI is the backstop.
      - name: Detect OpenTofu pin
        id: tofu
        shell: bash
        run: |
          pin=.github/opentofu.pin
          if [ ! -f "$pin" ]; then
            echo "has_pin=false" >> "$GITHUB_OUTPUT"
            echo "No $pin - skipping the OpenTofu install."
            exit 0
          fi
          get() {
            { grep -E "^[[:space:]]*$1=" "$pin" || true; } | tail -n 1 | cut -d= -f2- | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'
          }
          ver=$(get TOFU_VERSION)
          sha=$(get TOFU_SHA256)
          if ! printf '%s' "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::$pin: TOFU_VERSION missing or not X.Y.Z"
            exit 1
          fi
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::$pin: TOFU_SHA256 missing or not 64 lowercase hex chars"
            exit 1
          fi
          {
            echo "has_pin=true"
            echo "version=$ver"
            echo "sha256=$sha"
          } >> "$GITHUB_OUTPUT"
      - if: steps.tofu.outputs.has_pin == 'true'
        name: Install OpenTofu (pinned + checksummed, so tofu-dependent tests run)
        shell: bash
        env:
          TOFU_VERSION: ${{ steps.tofu.outputs.version }}
          TOFU_SHA256: ${{ steps.tofu.outputs.sha256 }}
        run: |
          set -euo pipefail
          asset="tofu_${TOFU_VERSION}_linux_amd64.tar.gz"
          curl -sSfL --retry 3 --retry-all-errors "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/${asset}" -o "$RUNNER_TEMP/${asset}"
          echo "${TOFU_SHA256}  $RUNNER_TEMP/${asset}" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/${asset}" -C "$RUNNER_TEMP" tofu
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$RUNNER_TEMP/tofu" "$HOME/.local/bin/tofu"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/tofu" version
      # A repo that ships deployable stacks under stacks/ has those compose
      # documents linted by its own test suite, and such a lint judges the
      # document `docker compose config` RESOLVES. A lint like that must
      # hard-refuse when the tool is missing rather than fall back to reading the
      # files as written -- so the tool has to be proven present BEFORE pytest.
      # Without this step a runner that lost the compose plugin would turn the
      # gate's proof into "0 passed, N skipped" and nobody would look.
      #
      # `docker compose config` parses and merges locally and never talks to a
      # daemon, so this needs the compose PLUGIN and nothing else -- no Docker
      # daemon, no LAN, no secrets. GitHub's ubuntu runners ship it, so the check
      # costs a second and fails loudly the day they stop. Keep it BEFORE pytest:
      # a red here names the real cause, where a red inside the suite would not.
      #
      # The stack lint rides IN pytest rather than in a CLI step of its own, and
      # that is deliberate: preflight.py is the local mirror of this file, it is a
      # shared kit tool that knows nothing about any one repo's CLI, and
      # preflight/ci.yml drift is a bug. Both run `pytest -q --durations=25`, so both run the
      # lint -- CI against Docker's real resolver, the workstation against
      # whatever stand-in the repo's conftest.py provides where Docker is absent.
      - name: Detect deployable stacks
        id: stacks
        shell: bash
        run: |
          # Test each candidate path, never `ls glob1 glob2 ...`: an unmatched
          # glob stays literal, ls then exits non-zero, and the check would say
          # "no stacks" for a repo that HAS one. Fail-open like that is exactly
          # the silent skip this step exists to prevent.
          has_stacks=false
          for f in stacks/*/compose.yaml stacks/*/compose.yml stacks/*/docker-compose.yaml stacks/*/docker-compose.yml; do
            if [ -f "$f" ]; then has_stacks=true; break; fi
          done
          echo "has_stacks=$has_stacks" >> "$GITHUB_OUTPUT"
          if [ "$has_stacks" = "false" ]; then
            echo "No stacks/*/compose.yaml - skipping the compose-resolver check."
          fi
      - if: steps.stacks.outputs.has_stacks == 'true'
        name: Require docker compose (the stack lint's resolver)
        shell: bash
        run: docker compose version
      - name: pytest (tolerate "no tests yet")
        shell: bash
        run: |
          pytest -q --durations=25 || [ $? -eq 5 ]   # exit code 5 = no tests collected

  # ---- Lua: lint + format check (Ubuntu only, keeps it simple; PR only) ----
  # Only runs when the repo actually contains Lua files.
  lua:
    needs: runner-guard
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON((github.event.repository.private && vars.CI_RUNS_ON) || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Detect Lua files
        id: detect
        shell: bash
        run: |
          if [ -n "$(find . -name '*.lua' -not -path './.git/*' -print -quit)" ]; then
            echo "has_lua=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_lua=false" >> "$GITHUB_OUTPUT"
            echo "No .lua files — skipping Lua checks."
          fi
      # DCS mission Lua targets the 5.1 sandbox — lint on the SAME runtime so
      # luacheck's std=lua51 guard reflects what DCS actually runs.
      # No sudo anywhere (GEN-76). GitHub-hosted runners install the packages with
      # the runner's own passwordless apt. Self-hosted svc-ci01 slots have no sudo:
      # Forge preinstalls the packages, and the next step FAILS if they are absent.
      - if: steps.detect.outputs.has_lua == 'true' && runner.environment == 'github-hosted'
        name: Install Lua 5.1 + luarocks (GitHub-hosted only)
        run: sudo apt-get update && sudo apt-get install -y lua5.1 liblua5.1-0-dev luarocks
      - if: steps.detect.outputs.has_lua == 'true'
        name: Require lua5.1 + luarocks (a broken host must fail, never pass silently)
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for t in lua5.1 luarocks; do
            if ! command -v "$t" >/dev/null 2>&1; then
              echo "::error::$t is not installed on this runner. Self-hosted hosts get it from Forge (svc-ci01); fix the host, do not skip this job."
              missing=1
            fi
          done
          exit "$missing"
      # luarocks installs go to ~/.luarocks (--local); no root needed.
      - if: steps.detect.outputs.has_lua == 'true'
        name: Install luacheck + busted (user tree)
        shell: bash
        run: |
          set -euo pipefail
          luarocks install --local --lua-version 5.1 luacheck
          luarocks install --local --lua-version 5.1 busted
          echo "$HOME/.luarocks/bin" >> "$GITHUB_PATH"
          paths="$(luarocks path --lua-version 5.1)"
          if [ -z "$paths" ]; then
            echo "::error::'luarocks path' returned nothing"
            exit 1
          fi
          # `luarocks path` prints: export LUA_PATH='...'  -- turn into KEY=VALUE lines.
          lines="$(printf '%s\n' "$paths" | sed -n "s/^export \([A-Z_]*\)='\(.*\)'$/\1=\2/p")"
          if ! printf '%s\n' "$lines" | grep -q '^LUA_PATH='; then
            echo "::error::'luarocks path' gave no LUA_PATH line"
            exit 1
          fi
          printf '%s\n' "$lines" >> "$GITHUB_ENV"
      - if: steps.detect.outputs.has_lua == 'true'
        run: luacheck .   # hard gate: a 5.1 violation fails the build
      - if: steps.detect.outputs.has_lua == 'true'
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check .
      # Behavioural gate: run the real Busted suite on the same 5.1 runtime.
      # A repo with a pure-Lua runner (e.g. spec/run.lua) can mirror this locally
      # where Busted can't build; CI is the authoritative framework run. Busted
      # reads .busted (auto-discovers spec/*_spec.lua) and passes if there are no
      # specs yet, so this is safe for a freshly-scaffolded Lua project.
      - if: steps.detect.outputs.has_lua == 'true'
        name: Busted (offline suite on Lua 5.1)
        run: busted

  # ---- Node/TypeScript: install + lint + typecheck + tests (Ubuntu only; PR only) ----
  # Only runs when the repo has a root package.json (e.g. an Expo/React Native
  # app). Mirrored locally by preflight.py — keep the two in step.
  node:
    needs: runner-guard
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON((github.event.repository.private && vars.CI_RUNS_ON) || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Detect Node project
        id: detect
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "has_node=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_node=false" >> "$GITHUB_OUTPUT"
            echo "No package.json — skipping Node checks."
          fi
          # Pin Node from .nvmrc when the repo has one; setup-node falls back
          # to the runner default when the input is empty.
          if [ -f .nvmrc ]; then
            echo "node_version_file=.nvmrc" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.detect.outputs.has_node == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: ${{ steps.detect.outputs.node_version_file }}
      # npm cache on the runner disk, self-hosted only (core v33, GEN-106). Not
      # setup-node's `cache:` input: that uses actions/cache and uploads to GitHub.
      # setup-node keeps node itself in the persistent runner tool cache. npm's
      # cache is safe for concurrent use. A missing dir is created.
      - if: steps.detect.outputs.has_node == 'true' && runner.environment != 'github-hosted'
        name: npm cache on runner disk (self-hosted)
        shell: bash
        run: |
          set -euo pipefail
          cache="$RUNNER_TOOL_CACHE/../ci-cache"
          mkdir -p "$cache/npm"
          echo "npm_config_cache=$(cd "$cache/npm" && pwd)" >> "$GITHUB_ENV"
      - if: steps.detect.outputs.has_node == 'true'
        name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - if: steps.detect.outputs.has_node == 'true'
        run: npm run lint --if-present
      - if: steps.detect.outputs.has_node == 'true'
        name: TypeScript typecheck
        shell: bash
        run: |
          if [ -f tsconfig.json ]; then
            npx tsc --noEmit
          else
            echo "no tsconfig.json — skipping typecheck"
          fi
      - if: steps.detect.outputs.has_node == 'true'
        run: npm run test --if-present

  # ---- Leakguard: re-scan for secrets in the cloud (can't be bypassed locally) ----
  # Runs on PRs AND on push to main: the ONE server-side check kept on the merge
  # commit, so a secret can never land on main un-scanned even though the rest of
  # the suite is PR-only.
  #
  # NO GITHUB API CALL ANYWHERE IN THIS JOB, AND THAT IS THE POINT.
  # It used to run gitleaks/gitleaks-action@ff98106e (v2.3.9), which resolved its
  # scan range by calling `GET /repos/<owner>/<repo>/pulls/<n>/commits` and proved
  # the owner was a personal account (its free-tier check) by calling
  # `GET /users/<owner>`. Both are reads, both are avoidable, and both went 403
  # "Resource not accessible by integration" against a private repo despite
  # `permissions: pull-requests: read` -- the action then crashed BEFORE scanning
  # anything. Measured on Homelab-Forge, 2026-08-17: PR#61 green, PR#62 red once
  # then green on a re-run, PR#63 red FOUR times (two re-runs plus a fresh run
  # after close/reopen). An earlier sighting of the same fault, on a different
  # repo, is recorded as GEN-33.
  #
  # That is worse than no gate. A secret check that goes red for reasons unrelated
  # to secrets teaches everyone to hit re-run until it goes green, which is exactly
  # how a real leak gets waved through. So the range now comes from the local git
  # clone, which `fetch-depth: 0` already guarantees is complete, and the scanner
  # is the plain gitleaks binary. Nothing here can 403.
  #
  # Do NOT "simplify" this back to the action, and do NOT make any step here
  # advisory (`continue-on-error`, `|| true`, `--exit-code 0`).
  gitleaks:
    needs: runner-guard
    runs-on: ${{ fromJSON((github.event.repository.private && vars.CI_RUNS_ON) || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Deep checkout so the range `<base>..<head>` can be resolved and walked
          # locally. NOTE: this does NOT make the job scan full history -- the scan
          # is limited to that range by `--log-opts`. Measured 2026-08-11 under the
          # old action: a real run logged "1 commits scanned". Don't restate this
          # as a full-history rescan.
          fetch-depth: 0
      # PINNED to an exact version AND to that release's published SHA-256, not to
      # a floating tag and not to `latest`: this workflow is copied into every
      # repo, so an upstream retag would change the secret gate everywhere at once.
      # The checksum is the real pin -- verify it, then trust the binary.
      # Bump both lines together, never one alone.
      - name: Install gitleaks (pinned + checksummed)
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 --retry-all-errors \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}" \
            -o "$RUNNER_TEMP/${asset}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/${asset}" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/${asset}" -C "$RUNNER_TEMP" gitleaks
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$RUNNER_TEMP/gitleaks" "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/gitleaks" version
      # Same scope as before, both events:
      #   pull_request -> base.sha..head.sha (every commit the PR adds)
      #   push to main -> event.before..sha  (the merge/squash commit)
      # Both SHAs come from the event payload, which is already in the runner's
      # environment -- no API call resolves them.
      #
      # The repo's own root .gitleaks.toml is picked up automatically (gitleaks
      # config precedence: --config, $GITLEAKS_CONFIG, then <target>/.gitleaks.toml).
      # That is the SAME file the local pre-commit gate and `leakguard.py scan`
      # use, and the same one the old action auto-discovered, so CI and the
      # workstation agree rule-for-rule: gitleaks' built-ins plus the workspace
      # Vikunja `tk_…` rule and the secret-file path rule. Coverage is unchanged.
      - name: Scan the pushed range for secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          # A branch-creation push sends an all-zero `before`, and a force-push can
          # name a commit that no longer exists. Neither yields a usable range, so
          # fall back to the whole history of HEAD: degrade by scanning MORE, never
          # less. A secret gate must never quietly narrow its own scope.
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "::notice::no usable base commit -- scanning full history of $head"
            range="$head"
          else
            range="${base}..${head}"
          fi
          echo "scanning range: $range ($(git rev-list --count "$range") commits)"
          # --redact so a finding is masked before it reaches the public log; the
          # non-zero exit, not the log text, is what fails the build.
          # --no-color is LOAD-BEARING, not cosmetic: gitleaks colours its level
          # column even when stdout is a file or a pipe, so `ERR` arrives wrapped
          # in escape codes and the fail-closed grep below silently never matches.
          # Verified both ways on 8.30.1, 2026-08-17. Do not drop this flag.
          rc=0
          gitleaks git --redact --verbose --no-banner --no-color \
            --log-opts="$range" . >"$RUNNER_TEMP/gitleaks.log" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/gitleaks.log"
          if [ "$rc" -ne 0 ]; then
            echo "::error::gitleaks exited $rc -- secrets found, or the scan failed. Read the log above before assuming either."
            exit 1
          fi
          # FAIL CLOSED on a scan that never ran. gitleaks >= 8.27 exits 0 after
          # logging `ERR`/`FTL` and reporting "0 commits scanned" (regression seen
          # on 8.30.1, 2026-08-11; 8.26 exited 1). Trusting the exit code alone
          # would put a green tick over an unscanned range -- the one failure mode
          # a secret scanner must not have. Same guard as leakguard.py's.
          if grep -Eq '(^|[[:space:]])(ERR|FTL)([[:space:]]|$)' "$RUNNER_TEMP/gitleaks.log"; then
            echo "::error::gitleaks logged an ERROR -- the scan did NOT complete. Treating as FAILED, not clean."
            exit 1
          fi
          echo "gitleaks: clean."

  # ---- Hard gate GitHub CAN see: every PR commit must reference a task ----
  commit-task-ref:
    needs: runner-guard
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON((github.event.repository.private && vars.CI_RUNS_ON) || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Every AGENTS.md is a generated copy of the CLAUDE.md beside it, for
      # Codex (card GEN-80, core v31). This job, not the python job, so Lua and
      # Node repos are gated too. python3 is on ubuntu-latest and svc-ci01. The
      # script exits 0 with a note when the repo tracks no CLAUDE.md. Same case-insensitive path lookup as docfacts. Keep this in lockstep
      # with preflight.py's mirror of it.
      - name: AGENTS.md matches CLAUDE.md (GEN-80)
        shell: bash
        run: |
          f=scripts/agentsmd.py
          [ -f "$f" ] || f=Scripts/agentsmd.py
          python3 "$f" --check
      - name: Require "#<id>" or this repo's "CODE-<n>" in every commit message
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          # This repo's project code, e.g. NETAUD (workspace ADR 0003). It lives
          # in a tracked one-line file because vikunja.config.json is gitignored
          # and CI can therefore never read it -- unlike the commit-msg hook,
          # which reads the config directly.
          #
          # A missing file, or anything that isn't a plain A-Z0-9 word, falls
          # back to global-ids-only: degrade TIGHTER, never looser, exactly as
          # the hook does. Never widen this to a loose [A-Z]+-[0-9]+ -- that
          # stops being a gate at all, since "UTF-8", "SHA-256", "ISO-8601" and
          # "CVE-2024-1234" all satisfy it with no task ref present.
          CODE=""
          if [ -f .vikunja-code ]; then
            CODE="$(tr -d '[:space:]' < .vikunja-code)"
          fi
          case "$CODE" in
            "")          ;;
            *[!A-Z0-9]*) CODE="" ;;
          esac
          bad=0
          for sha in $(git rev-list "$base".."$head"); do
            subject="$(git log -1 --format='%s' "$sha")"
            case "$subject" in Merge\ *|Revert\ *) continue ;; esac
            msg="$(git log -1 --format='%s%n%b' "$sha")"
            if printf '%s' "$msg" | grep -Eq '#[0-9]+'; then
              continue
            fi
            if [ -n "$CODE" ] && printf '%s' "$msg" \
                 | grep -Eq "(^|[^A-Za-z0-9_-])${CODE}-[0-9]+([^A-Za-z0-9]|$)"; then
              continue
            fi
            echo "::error::commit $sha has no task ref (#id${CODE:+ or ${CODE}-<n>}): $subject"
            bad=1
          done
          exit $bad
