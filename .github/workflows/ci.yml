name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  # ---- Python: lint + format check + tests on both OSes ----
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff pytest
      - run: ruff check .
      - run: ruff format --check .
      - name: pytest (tolerate "no tests yet")
        shell: bash
        run: |
          pytest -q || [ $? -eq 5 ]   # exit code 5 = no tests collected

  # ---- Lua: lint + format check (Ubuntu only, keeps it simple) ----
  # Only runs when the repo actually contains Lua files.
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect Lua files
        id: detect
        shell: bash
        run: |
          if [ -n "$(find . -name '*.lua' -not -path './.git/*' -print -quit)" ]; then
            echo "has_lua=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_lua=false" >> "$GITHUB_OUTPUT"
            echo "No .lua files — skipping Lua checks."
          fi
      - if: steps.detect.outputs.has_lua == 'true'
        run: sudo apt-get update && sudo apt-get install -y lua5.4 luarocks
      - if: steps.detect.outputs.has_lua == 'true'
        run: sudo luarocks install luacheck
      - if: steps.detect.outputs.has_lua == 'true'
        run: luacheck . || true   # start lenient; remove "|| true" to enforce
      - if: steps.detect.outputs.has_lua == 'true'
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check .

  # ---- Leakguard: re-scan for secrets in the cloud (can't be bypassed locally) ----
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so a secret in any commit is caught
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action is free for public repos; uses the repo's .gitleaks.toml.

  # ---- Hard gate GitHub CAN see: every PR commit must reference a task ----
  commit-task-ref:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require "#<id>" in every commit message
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          bad=0
          for sha in $(git rev-list "$base".."$head"); do
            subject="$(git log -1 --format='%s' "$sha")"
            case "$subject" in Merge\ *|Revert\ *) continue ;; esac
            if ! git log -1 --format='%s%n%b' "$sha" | grep -Eq '#[0-9]+'; then
              echo "::error::commit $sha has no task ref (#id): $subject"
              bad=1
            fi
          done
          exit $bad
