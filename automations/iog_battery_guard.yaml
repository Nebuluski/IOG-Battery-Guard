# =============================================================================
# IOG Battery-Guard - pause GivEnergy discharge during IOG dispatch OR Zappi charging
# =============================================================================
# WHAT IT DOES
#   It tells the GivEnergy battery to STOP discharging whenever EITHER:
#     (1) Octopus "Intelligent Octopus Go" is running a cheap dispatch slot
#         (the guaranteed 23:30-05:30 window *and* daytime smart bumps), OR
#     (2) the myenergi Zappi is actively charging the car (drawing > 200 W).
#   ...so cheap grid import powers the car + house instead of draining the battery.
#   When BOTH are clear again, it cancels the pause (battery back to normal).
#
# HOW THE PAUSE WORKS (GivTCP 3.6.14)
#   GivTCP has no untimed "battery pause mode" select on this inverter. It has a
#   TIMED pause: select.givtcp_sd2145g043_temp_pause_discharge.
#     - pick "60"     -> discharge paused for 60 minutes; the select reads "Running"
#     - pick "Cancel" -> pause ends now, discharge rate is restored
#     - after the time runs out GivTCP sets the select back to "Normal"
#   So this automation RE-ARMS the pause: when a pause ends ("Normal") while a
#   trigger still holds, it picks "60" again at once. A 5-minute check is the
#   safety net. It never touches force charge/export, mode, reserve, slots or rates.
#
# FAIL-SAFE ON SENSOR DROPOUT
#   - A sensor that is unavailable/unknown never STARTS a pause.
#   - A sensor that is unavailable/unknown never ENDS a pause: if a pause runs
#     out while a sensor is unknown, the pause is re-armed.
#
# NOTE on "Both": this pauses for ANY Zappi charging, including a manual Boost.
#
# ENTITY IDS (live, from Home Assistant)
#   Octopus dispatch: the IOG device's binary_sensor. Its id holds the Octopus
#   device id; replace <octopus_device> with yours (Developer Tools -> States,
#   filter "intelligent_dispatching", pick the one that reads on/off, not
#   unavailable). The installer script substitutes the real id.
#   Zappi power:      sensor.myenergi_zappi_16103438_power_ct_internal_load (W)
#   Pause control:    select.givtcp_sd2145g043_temp_pause_discharge
# -----------------------------------------------------------------------------

- alias: "IOG Battery-Guard - pause discharge during IOG dispatch or Zappi charging"
  id: iog_battery_guard
  description: >-
    Pause GivEnergy battery discharge (GivTCP timed temp pause, re-armed) while
    Octopus Intelligent Go is dispatching OR the Zappi is charging the car;
    cancel the pause when both are known clear.
  mode: queued
  max: 5
  max_exceeded: silent

  triggers:
    - trigger: state
      entity_id: binary_sensor.octopus_energy_<octopus_device>_intelligent_dispatching
      to: "on"
    - trigger: state
      entity_id: binary_sensor.octopus_energy_<octopus_device>_intelligent_dispatching
      to: "off"
    - trigger: numeric_state
      entity_id: sensor.myenergi_zappi_16103438_power_ct_internal_load
      above: 200
      for: "00:00:10"
    - trigger: numeric_state
      entity_id: sensor.myenergi_zappi_16103438_power_ct_internal_load
      below: 200
      for: "00:00:10"
    # A timed pause ended (ran out or was cancelled): re-arm if still needed
    - trigger: state
      entity_id: select.givtcp_sd2145g043_temp_pause_discharge
      to: "Normal"
      id: pause_ended
    - trigger: homeassistant
      event: start
    - trigger: time_pattern
      minutes: "/5"

  actions:
    - variables:
        dispatch: "{{ states('binary_sensor.octopus_energy_<octopus_device>_intelligent_dispatching') }}"
        zappi_raw: "{{ states('sensor.myenergi_zappi_16103438_power_ct_internal_load') }}"
        zappi_known: "{{ is_number(zappi_raw) }}"
        zappi_w: "{{ zappi_raw | float(0) }}"
        pause_state: "{{ states('select.givtcp_sd2145g043_temp_pause_discharge') }}"
        need_pause: "{{ dispatch == 'on' or (zappi_known and zappi_w > 200) }}"
        known_clear: "{{ dispatch == 'off' and zappi_known and zappi_w < 200 }}"
        unknown_after_pause: >-
          {{ trigger is defined and trigger.id == 'pause_ended'
             and not need_pause and not known_clear }}
    - choose:
        # PAUSE / RE-ARM: a trigger holds (or a sensor dropped out just as a
        # pause ended) and no pause is running now.
        - conditions:
            - condition: template
              value_template: "{{ (need_pause or unknown_after_pause) and pause_state in ['Normal', 'Cancel'] }}"
          sequence:
            - action: select.select_option
              target:
                entity_id: select.givtcp_sd2145g043_temp_pause_discharge
              data:
                option: "60"
            - action: persistent_notification.dismiss
              data:
                notification_id: iog_battery_guard
            # Stops a re-arm storm if the select reads "Normal" straight after "60"
            - delay: "00:01:00"
        # FAILURE VISIBLE: a pause is needed but the control cannot be used.
        - conditions:
            - condition: template
              value_template: "{{ need_pause and pause_state in ['unknown', 'unavailable'] }}"
          sequence:
            - action: persistent_notification.create
              data:
                notification_id: iog_battery_guard
                title: "IOG Battery-Guard"
                message: "Battery guard cannot pause discharge: GivTCP pause control unavailable"
        # RELEASE: both sensors known clear and a pause is running.
        - conditions:
            - condition: template
              value_template: >-
                {{ known_clear and pause_state not in
                   ['Normal', 'Cancel', 'unknown', 'unavailable'] }}
          sequence:
            - action: select.select_option
              target:
                entity_id: select.givtcp_sd2145g043_temp_pause_discharge
              data:
                option: "Cancel"

# =============================================================================
# IOG Off-window charge - force charge the battery during a daytime IOG dispatch
# =============================================================================
# WHAT IT DOES (IOG-23, ADR 0002)
#   When an IOG dispatch runs OUTSIDE the 23:30-05:30 cheap window, it starts a
#   GivTCP timed force charge (select.givtcp_sd2145g043_force_charge) so the
#   battery fills at the cheap rate too. When the dispatch ends, or 23:30 comes,
#   it cancels the force - but ONLY a force that this run started.
#   - Length: minutes to the dispatch current_end, rounded UP to the next force
#     option (2 ... 180). No current_end -> 30. Longer than 180 -> re-armed when
#     GivTCP times the force out.
#   - A force the owner started from the card is never cancelled or replaced.
#   - The owner presses Force stop (select reads "Cancel") -> it stops managing
#     the force for the rest of this dispatch.
#   - It never touches the discharge pause. The battery guard above still wins.
#   - Battery full or charge target reached: GivTCP stops charging by itself.
# -----------------------------------------------------------------------------

- alias: "IOG Off-window charge - force charge during a daytime IOG dispatch"
  id: iog_offwindow_charge
  description: >-
    Force charge the GivEnergy battery (GivTCP timed force, re-armed) while an
    Octopus Intelligent Go dispatch runs outside 23:30-05:30; cancel the force
    this automation started when the dispatch ends or the cheap window starts.
  mode: single
  max_exceeded: silent

  triggers:
    - trigger: state
      entity_id: binary_sensor.octopus_energy_<octopus_device>_intelligent_dispatching
      to: "on"
    - trigger: time
      at: "05:30:00"
    - trigger: homeassistant
      event: start
    - trigger: time_pattern
      minutes: "/5"

  conditions:
    - condition: state
      entity_id: binary_sensor.octopus_energy_<octopus_device>_intelligent_dispatching
      state: "on"
    - condition: template
      value_template: >-
        {%- set m = now().hour * 60 + now().minute -%}{{ not (m >= 1410 or m < 330) }}

  actions:
    - variables:
        owned: false
        user_stop: false
    - repeat:
        while:
          - condition: template
            value_template: >-
              {%- set m = now().hour * 60 + now().minute -%}
              {{ is_state('binary_sensor.octopus_energy_<octopus_device>_intelligent_dispatching', 'on')
                 and not (m >= 1410 or m < 330) and not user_stop }}
        sequence:
          - choose:
              # START / RE-ARM: no force runs now.
              - conditions:
                  - condition: template
                    value_template: "{{ states('select.givtcp_sd2145g043_force_charge') in ['Normal', 'Cancel'] }}"
                sequence:
                  - variables:
                      mins: >-
                        {%- set e = as_timestamp(state_attr('binary_sensor.octopus_energy_<octopus_device>_intelligent_dispatching', 'current_end'), none) -%}
                        {%- set left = ((e - as_timestamp(now())) / 60) | round(0, 'ceil') | int if e is not none else 30 -%}
                        {%- set fit = [2, 5, 10, 15, 30, 45, 60, 75, 90, 105, 120, 135, 150, 165, 180] | select('>=', left) | list -%}
                        {{ (fit | first if fit else 180) | string }}
                  - action: select.select_option
                    target:
                      entity_id: select.givtcp_sd2145g043_force_charge
                    data:
                      option: "{{ mins }}"
                  - variables:
                      owned: true
                  - action: persistent_notification.dismiss
                    data:
                      notification_id: iog_offwindow_charge
                  - action: logbook.log
                    data:
                      name: IOG Off-window charge
                      message: "force charge started for {{ mins }} min (daytime dispatch)"
                  # Stops a re-arm storm if the select reads "Normal" straight after
                  - delay: "00:01:00"
              # FAILURE VISIBLE: the force control cannot be used.
              - conditions:
                  - condition: template
                    value_template: "{{ states('select.givtcp_sd2145g043_force_charge') in ['unknown', 'unavailable'] }}"
                sequence:
                  - action: persistent_notification.create
                    data:
                      notification_id: iog_offwindow_charge
                      title: "IOG Off-window charge"
                      message: "Cannot force charge during the dispatch: GivTCP force charge control unavailable"
          - wait_for_trigger:
              - trigger: state
                entity_id: binary_sensor.octopus_energy_<octopus_device>_intelligent_dispatching
                to: "off"
              - trigger: state
                entity_id: select.givtcp_sd2145g043_force_charge
                to: "Normal"
              - trigger: state
                entity_id: select.givtcp_sd2145g043_force_charge
                to: "Cancel"
                id: force_cancelled
              - trigger: time
                at: "23:30:00"
            timeout: "00:05:00"
            continue_on_timeout: true
          # The owner pressed Force stop on our force: leave it alone now.
          - variables:
              user_stop: >-
                {{ owned and wait.trigger is not none and wait.trigger.id == 'force_cancelled' }}
              owned: >-
                {{ owned and states('select.givtcp_sd2145g043_force_charge') not in ['Normal', 'Cancel'] }}
    # STOP: dispatch ended or the cheap window started; cancel only our own force.
    - if:
        - condition: template
          value_template: >-
            {{ owned and states('select.givtcp_sd2145g043_force_charge') not in
               ['Normal', 'Cancel', 'unknown', 'unavailable'] }}
      then:
        - action: select.select_option
          target:
            entity_id: select.givtcp_sd2145g043_force_charge
          data:
            option: "Cancel"
        - action: logbook.log
          data:
            name: IOG Off-window charge
            message: "force charge cancelled (dispatch ended or cheap window started)"
