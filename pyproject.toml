# Project tooling config.
# - pytest: put the repo root on sys.path so `from src.x import ...` works.
# - ruff:   lint + format settings (kept lenient).

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pin the lint surface explicitly to ruff's classic default select (E/F) rather than
# relying on the implicit default, which ruff 0.16 widened (adding RUF/UP/FLY/EXE) --
# an unpinned `pip install ruff` in CI otherwise changes what "default" means between
# runs. Declaring it keeps lint deterministic across ruff versions (preflight == CI).
select = ["E4", "E7", "E9", "F"]
